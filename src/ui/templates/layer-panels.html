  <div id="left-panel-stack">
  <!-- Data Layer Toggle Panel -->
  <div id="data-panel" class="panel-collapsible collapsed active" data-panel-id="data-panel">
    <div class="panel-glow"></div>
    <div class="data-panel-inner">
      <div class="panel-header">
        <span class="panel-title" data-i18n="panel.dataLayers">DATA LAYERS</span>
        <span class="panel-divider"></span>
        <button class="panel-collapse-btn" data-collapse-target="data-panel" title="Collapse panel" data-i18n-attr="title:panel.collapsePanel">+</button>
      </div>
      <div id="data-toggles" class="data-toggle-list"></div>
    </div>
  </div>

  <!-- CCTV Coverage Panel -->
  <div id="cctv-panel" class="panel-collapsible collapsed" data-panel-id="cctv-panel">
    <div class="panel-glow"></div>
    <div class="cctv-panel-inner" data-rail-scroller>
      <div class="panel-header">
        <span class="panel-title">CCTV</span>
        <span class="panel-divider"></span>
        <button class="panel-collapse-btn" data-collapse-target="cctv-panel" title="Collapse panel" data-i18n-attr="title:panel.collapsePanel">+</button>
      </div>
      <div class="cyber-panel-body" data-rail-scroller>
      <div id="cctv-frame-wrap" class="cctv-frame-wrap">
        <img id="cctv-frame" alt="CCTV feed frame" />
        <canvas id="cctv-video" class="cctv-frame" hidden></canvas>
      </div>
      <div id="cctv-source-badge" role="status" aria-live="polite">SOURCE · UNKNOWN</div>
      <div id="cctv-meta">Enable CCTV to load camera intersections</div>
      <div class="cctv-controls">
        <button id="cctv-enable-btn" class="scene-btn">CCTV OFF</button>
        <button id="cctv-nearest-btn" class="scene-btn" data-i18n="cctv.nearest">NEAREST</button>
      </div>
      <div class="cctv-controls">
        <button id="cctv-prev-btn" class="scene-btn" data-i18n="cctv.prev">PREV</button>
        <select id="cctv-camera-select" aria-label="CCTV camera" data-i18n-attr="aria-label:cctv.tip.camera"></select>
        <button id="cctv-next-btn" class="scene-btn" data-i18n="cctv.next">NEXT</button>
      </div>
      <div class="cctv-controls">
        <button id="cctv-focus-btn" class="scene-btn" data-i18n="cctv.focus">FOCUS</button>
        <button id="cctv-coverage-btn" class="scene-btn">COVERAGE OFF</button>
        <button id="cctv-auto-hop-btn" class="scene-btn">AUTO HOP OFF</button>
      </div>
      <div class="cctv-controls">
        <button id="cctv-projection-btn" class="scene-btn">PROJECTION ON</button>
        <span id="cctv-quality-chip">CAL · --</span>
      </div>
      <div class="cctv-calibration-block">
        <div class="cctv-calibration-header">
          <div class="cctv-summary-label" data-i18n="cctv.calibration">CALIBRATION</div>
          <button id="cctv-adjust-btn" class="scene-btn" title="Drag the camera in the world: rings rotate, arrows move, handles set range/FOV" data-i18n-attr="title:cctv.tip.adjust">ADJUST</button>
        </div>
        <div id="cctv-cal-readout" class="cctv-cal-readout" aria-label="Camera pose — click a value to type" data-i18n-attr="aria-label:cctv.tip.pose">
          <button class="cctv-cal-value" data-cal-field="heading" title="Heading (compass °) — click to type" data-i18n-attr="title:cctv.tip.heading">HDG --</button>
          <button class="cctv-cal-value" data-cal-field="pitch" title="Pitch (° up/down) — click to type" data-i18n-attr="title:cctv.tip.pitch">PITCH --</button>
          <button class="cctv-cal-value" data-cal-field="fov" title="Horizontal FOV (°) — click to type" data-i18n-attr="title:cctv.tip.fov">FOV --</button>
          <button class="cctv-cal-value" data-cal-field="range" title="Range / monitor-plane distance (m) — click to type" data-i18n-attr="title:cctv.tip.range">RANGE --</button>
          <button class="cctv-cal-value" data-cal-field="height" title="Mount height above ground (m) — click to type" data-i18n-attr="title:cctv.tip.height">HGT --</button>
          <button class="cctv-cal-value" data-cal-field="north" title="North offset from catalog position (m) — click to type" data-i18n-attr="title:cctv.tip.north">ΔN --</button>
          <button class="cctv-cal-value" data-cal-field="east" title="East offset from catalog position (m) — click to type" data-i18n-attr="title:cctv.tip.east">ΔE --</button>
        </div>
        <div class="cctv-controls cctv-calibration-actions">
          <button id="cctv-calib-save-btn" class="scene-btn" data-i18n="cctv.saveCal">SAVE CAL</button>
          <button id="cctv-calib-reset-btn" class="scene-btn" data-i18n="cctv.resetCal">RESET CAL</button>
        </div>
      </div>
      <div class="cctv-summary-label" data-i18n="cctv.sceneSummary">SCENE SUMMARY</div>
      <div id="cctv-summary">Enable CCTV to start camera-linked intelligence summaries.</div>
      </div>
    </div>
  </div>

  <!-- Scene Director Panel -->
  <div id="scene-panel" class="panel-collapsible collapsed" data-panel-id="scene-panel">
    <div class="panel-glow"></div>
    <div class="scene-panel-inner">
      <div class="panel-header">
        <span class="panel-title" data-i18n="panel.scenes">SCENES</span>
        <span class="panel-divider"></span>
        <button class="panel-collapse-btn" data-collapse-target="scene-panel" title="Collapse panel" data-i18n-attr="title:panel.collapsePanel">+</button>
      </div>
      <div class="scene-controls">
        <select id="scene-select" aria-label="Scene recipe"></select>
        <button id="scene-new-btn" class="scene-btn" data-i18n="scenes.new">NEW</button>
        <button id="scene-delete-btn" class="scene-btn scene-btn-danger" data-i18n="scenes.del">DEL</button>
      </div>
      <div class="scene-controls">
        <button id="scene-capture-btn" class="scene-btn" data-i18n="scenes.capture">CAPTURE SHOT</button>
        <button id="scene-update-shot-btn" class="scene-btn" data-i18n="scenes.updateShot">UPDATE SHOT</button>
      </div>
      <div id="scene-shot-list" class="scene-shot-list"></div>
      <div class="scene-controls">
        <button id="scene-start-btn" class="scene-btn" data-i18n="scenes.start">START</button>
        <button id="scene-stop-btn" class="scene-btn scene-btn-danger" data-i18n="scenes.stop">STOP</button>
        <button id="scene-next-btn" class="scene-btn" data-i18n="scenes.next">NEXT</button>
      </div>
      <div class="scene-controls">
        <button id="scene-export-btn" class="scene-btn" data-i18n="scenes.export">EXPORT PRESETS</button>
        <button id="scene-import-btn" class="scene-btn" data-i18n="scenes.import">IMPORT</button>
        <button id="scene-download-btn" class="scene-btn" data-i18n="scenes.runLog">RUN LOG</button>
        <input type="file" id="scene-import-file" accept="application/json,.json" hidden />
      </div>
      <div class="scene-progress">
        <div id="scene-progress-fill">0%</div>
      </div>
      <div id="scene-status">Ready</div>
    </div>
  </div>

  </div>
